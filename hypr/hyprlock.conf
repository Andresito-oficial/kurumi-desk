general {
    no_fade_in = false
    no_fade_out = false
    # Cuanto más bajo sea el step, más lento el fade
    in_step = 0.1
    out_step = 0.1
}

background {
    monitor =
    path =  # No cargamos imagen para que se vea el video de mpvpaper
    color = rgba(0, 0, 0, 0) # Transparencia total
    blur_passes = 0
}

# TIME (Zaphkiel Style)
label {
    monitor =
    text = $TIME
    color = rgba(255, 0, 60, 0.8)
    font_size = 120
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 150
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(255, 0, 60, 0.6)
    inner_color = rgba(15, 15, 15, 0.8)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    placeholder_text = <i>Input password for Zaphkiel...</i>
    hide_input = false
    position = 0, -50
    halign = center
    valign = center
}

# OPCIONAL: Si quieres que el reloj de Zaphkiel resalte más sobre Kurumi
label {
    monitor =
    text = $TIME
    color = rgba(255, 0, 60, 0.9) # Rojo carmesí intenso
    font_size = 120
    font_family = JetBrainsMono Nerd Font Bold
    shadow_passes = 3 # Añade una sombra para que se lea mejor sobre la imagen
    shadow_res = 2
    position = 0, 150
    halign = center
    valign = center
}
