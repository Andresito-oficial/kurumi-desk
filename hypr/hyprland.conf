
# #######################################################################################
# AUTOGENERATED HYPRLAND CONFIG.
# PLEASE USE THE CONFIG PROVIDED IN THE GIT REPO /examples/hyprland.conf AND EDIT IT,
# OR EDIT THIS ONE ACCORDING TO THE WIKI INSTRUCTIONS.
# #######################################################################################
autogenerated = 0 # remove this line to remove the warning

				
	# This is an example Hyprland config file.
	# Refer to the wiki for more information.
	# https://wiki.hyprland.org/Configuring/

	# Please note not all available settings / options are set here.
	# For a full list, see the wiki

	# You can split this configuration into multiple files
	# Create your files separately and then link them to this file like this:
	# source = ~/.config/hypr/myColors.conf


	################
	### MONITORS ###
	################

	# See https://wiki.hyprland.org/Configuring/Monitors/
	monitor= desc:LG Display 0x0724, 1920x1080@60, 0x0, 1
	monitor= desc:HAT Kamvas 13 0x01010101, 1920x1080@60, auto, 1
	monitor= desc:HP Inc. HP P27q G4 CNC14629WY, 2560x1440@59.95100, auto, 1
	monitor= desc:HP Inc. HP P27q G4 0x01010101, 2560x1440@59.95, auto, 1
	monitor= desc:ASUSTek COMPUTER INC ASUS VG289Q1A R8LMTF151421, 3840x2160@60, auto, 1
	monitor= desc:Technical Concepts Ltd MT5531, 1920x1080@60, auto, 1


	###################
	### MY PROGRAMS ###
	###################

	# See https://wiki.hyprland.org/Configuring/Keywords/

	# Set programs that you use
	$terminal = hyper
	$fileManager = thunar
	$webbrowser = opera-gx
	$menu = wofi --show drun


	#################
	### AUTOSTART ###
	#################

	# Autostart necessary processes (like notifications daemons, status bars, etc.)
	# Or execute your favorite apps at launch like this:

	# exec-once = $terminal
	# exec-once = nm-applet &
	# exec-once = waybar & hyprpaper & firefox
	# 1. Necesitas instalar wl-clipboard: sudo apt install wl-clipboard
	exec-once = wl-paste --type text --watch cliphist store
	exec-once = wl-paste --type image --watch cliphist store
	exec-once = hyprctl setcursor Luka-animated-cursor 32
	exec-once = pkill kdeconnectd
	#exec-once = hyprctl setcursor Luka_Static 32
	#exec-once = LD_LIBRARY_PATH="$HOME/hypr-compat/usr/lib/x86_64-linux-gnu:$HOME/hypr-compat/usr/lib" hyprpaper
	#exec-once = waybar
	#exec-once = hypridle
	#exec-once = sleep 1 && /home/andres/set_wallpaper.sh
	#exec-once = otd-daemon
	#exec-once = /home/andres/events_handler.sh
	#exec-once = sleep 2 && nm-applet --indicator
	#exec-once = sleep 2 && kdeconnect-indicator
	#exec-once = ~/.local/bin/zaphkiel_nightmare.sh
	# Esto sincroniza el entorno con DBus y Systemd (vital para Flatpak)
	#exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=Hyprland && systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

	# Lanza el portal que acabas de compilar
	#exec-once = /usr/local/libexec/xdg-desktop-portal-hyprland
	#exec-once = ~/.local/bin/zaphkiel_switch.sh
	#exec-once = swabg -o "LG Display 0x0724" -i ~/Imágenes/wallpaper/raizen-kurumi.jpeg
	# Sincronización básica de entorno

	exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=Hyprland && systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

	# Lanzar portales y servicios
	exec-once = /usr/local/libexec/xdg-desktop-portal-hyprland
	exec-once = hypridle
	exec-once = otd-daemon
	
	# El resto de apps que necesites
	exec-once = sleep 2 && nm-applet --indicator
	exec-once = sleep 2 && kdeconnect-indicator
	exec-once = /home/andres/events_handler.sh
	exec-once = /home/andres/set_wallpaper.sh
	exec-once = waybar
	exec-once = swaync

	# Zaphkiel lanza Waybar y configura todo
	#exec-once = /home/andres/.local/bin/zaphkiel_nightmare.sh
	exec-once = bash -c 'until curl -s https://api.sunrise-sunset.org > /dev/null 2>&1; do sleep 2; done && /home/andres/zaphkiel_nightmare.sh'

	exec-once = /usr/lib/gsd-xsettings
	exec-once = /usr/lib/gsd-color
	exec-once = /usr/lib/gsd-power
	exec-once = sleep 3 && canberra-gtk-play --id desktop-login

	#############################
	### ENVIRONMENT VARIABLES ###
	#############################

	# See https://wiki.hyprland.org/Configuring/Environment-variables/

	env = GDK_BACKEND, wayland, x11
	env = HYPRSHOT_DIR,$HOME/Pictures/Screenshots
	env = ELECTRON_OZONE_PLATFORM_HINT,wayland
	#env = XCURSOR_THEME,Luka_Static



	#####################
	### LOOK AND FEEL ###
	#####################

	# Refer to https://wiki.hyprland.org/Configuring/Variables/

	# https://wiki.hyprland.org/Configuring/Variables/#general
	general {
	    gaps_in = 5
	    gaps_out = 20

	    border_size = 2

	    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
	    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
	    col.inactive_border = rgba(595959aa)

	    # Set to true enable resizing windows by clicking and dragging on borders and gaps
	    resize_on_border = false

	    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
	    allow_tearing = false

	    layout = master
	}

	# https://wiki.hyprland.org/Configuring/Variables/#decoration
	decoration {
	    rounding = 10

	    # Change transparency of focused and unfocused windows
	    active_opacity = 1.0
	    inactive_opacity = 1.0

	    shadow {
		enabled = true
		range = 4
		render_power = 3
		color = rgba(1a1a1aee)
	    }

	    # https://wiki.hyprland.org/Configuring/Variables/#blur
	    blur {
		enabled = true
		size = 3
		passes = 1

		vibrancy = 0.1696
	    }
	}

	# https://wiki.hyprland.org/Configuring/Variables/#animations
	animations {
	    enabled = yes, please :)

	    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

	    bezier = easeOutQuint,0.23,1,0.32,1
	    bezier = easeInOutCubic,0.65,0.05,0.36,1
	    bezier = linear,0,0,1,1
	    bezier = almostLinear,0.5,0.5,0.75,1.0
	    bezier = quick,0.15,0,0.1,1

	    animation = global, 1, 10, default
	    animation = border, 1, 5.39, easeOutQuint
	    animation = windows, 1, 4.79, easeOutQuint
	    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
	    animation = windowsOut, 1, 1.49, linear, popin 87%
	    animation = fadeIn, 1, 1.73, almostLinear
	    animation = fadeOut, 1, 1.46, almostLinear
	    animation = fade, 1, 3.03, quick
	    animation = layers, 1, 3.81, easeOutQuint
	    animation = layersIn, 1, 4, easeOutQuint, fade
	    animation = layersOut, 1, 1.5, linear, fade
	    animation = fadeLayersIn, 1, 1.79, almostLinear
	    animation = fadeLayersOut, 1, 1.39, almostLinear
	    animation = workspaces, 1, 1.94, almostLinear, fade
	    animation = workspacesIn, 1, 1.21, almostLinear, fade
	    animation = workspacesOut, 1, 1.94, almostLinear, fade
	}

	# Ref https://wiki.hyprland.org/Configuring/Workspace-Rules/
	# "Smart gaps" / "No gaps when only"
	# uncomment all if you wish to use that.
	# workspace = w[tv1], gapsout:0, gapsin:0
	# workspace = f[1], gapsout:0, gapsin:0
	# windowrulev2 = bordersize 0, floating:0, onworkspace:w[tv1]
	# windowrulev2 = rounding 0, floating:0, onworkspace:w[tv1]
	# windowrulev2 = bordersize 0, floating:0, onworkspace:f[1]
	# windowrulev2 = rounding 0, floating:0, onworkspace:f[1]
	# Esta regla intenta enviar al workspace especial cualquier ventana que pida minimizarse
	#windowrulev2 = movetoworkspacesilent special:minimized, onminimize
	# Esto evita que Hyprland fuerce el cursor del sistema en apps XWayland
	#windowrulev2 = nofocus, class:^(opera)$, title:^(.*)$
	# O mejor aún, usa esta regla para evitar que el compositor fuerce el cursor:
	#windowrulev2 = cursor_invisible, class:^(opera)$

	cursor {
		no_warps = true
		# Esto permite que aplicaciones XWayland (como Opera) manejen mejor sus propios cursores
		no_hardware_cursors = true
		#sync_fullscreen = true
		enable_hyprcursor = true
	}

	# Fuerza a Opera a usar el renderizado de software para el cursor


	# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
	dwindle {
	    preserve_split = true # You probably want this
	}

	# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
	master {
	    new_status = master
	    orientation = left
	}

	# https://wiki.hyprland.org/Configuring/Variables/#misc
	misc {
	    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
	    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
	    session_lock_xray = true
	}


	#############
	### INPUT ###
	#############

	# https://wiki.hyprland.org/Configuring/Variables/#input
	input {
	    kb_layout = es
	    kb_variant =
	    kb_model =
	    kb_options =
	    kb_rules =
	    numlock_by_default = true

	    follow_mouse = 1

	    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

	    touchpad {
		natural_scroll = false
	    }
	}

	# https://wiki.hyprland.org/Configuring/Variables/#gestures

	# Example per-device config
	# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
	device {
	    name = epic-mouse-v1
	    sensitivity = -0.5
	}

	device {
	    name = opentabletdriver-virtual-tablet-stylus
	    output = desc:HAT Kamvas 13 0x01010101
	}
	
	device {
	   name = opentabletdriver-virtual-tablet
	   output = desc:HAT Kamvas 13 0x01010101
	}


	###################
	### KEYBINDINGS ###
	###################

	# See https://wiki.hyprland.org/Configuring/Keywords/
	$mainMod = SUPER # Sets "Windows" key as main modifier

	# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
	bind = $mainMod, Q, exec, $terminal
	bind = $mainMod, C, killactive,
	bind = $mainMod, M, exec, ~/.config/hypr/scripts/logout-sound.sh
	bind = $mainMod, E, exec, $fileManager
	bind = $mainMod, V, togglefloating,
	bind = $mainMod, R, exec, $menu
	bind = $mainMod, P, exec, hyprctl dispatch window.pseudo
	#bind = $mainMod, J, layoutmsg, togglesplit, # dwindle
	# dwindle split orientation toggle
	bind = $mainMod, J, layoutmsg, togglesplit

	# Atajos para aplicaciones específicas
	bind = $mainMod, D, exec, discord --enable-features=UseOzonePlatform --ozone-platform=wayland
	bind = $mainMod, T, exec, thunderbird
	# Prueba llamar directamente al binario
	#bind = $mainMod, L, exec, hyprlock
	bind = $mainMod, L, exec, ~/.local/bin/lock_kurumi.sh
	# Opens Konsole with the profile determined by the nightmare script
	#bind = $mainMod, RETURN, exec, konsole --profile $(cat /tmp/konsole_current_profile || echo "Kurumi")
	bind = $mainMod, RETURN, exec, konsole --profile $(cat /tmp/konsole_current_profile)
	# Abrir/cerrar el centro de notificaciones con Super + N
	bind = SUPER, N, exec, swaync-client -t -sw

	# Print: Screen capture active area
	#bind = Print, exec, grimblast --notify copysave area

	# Shift+Print: Screen capture whole screen
	#bind = SHIFT, Print, exec, grimblast --notify copysave screen
	# Capturar región con la tecla Imprimir Pantalla
	#bind = , Print, exec, hyprshot -m region
	
	# Capturar una región (seleccionar con ratón)
	bind = , Print, exec, hyprshot -m region
	# Capturar la ventana activa (detecta bordes sola)
	bind = SUPER, Print, exec, hyprshot -m window
	#Capturar monitor completo
	bind = CONTROL, Print, exec, hyprshot -m output


	# Move focus with mainMod + arrow keys
	bind = $mainMod, left, movefocus, l
	bind = $mainMod, right, movefocus, r
	bind = $mainMod, up, movefocus, u
	bind = $mainMod, down, movefocus, d

	# Switch workspaces with mainMod + [0-9]
	bind = $mainMod, 1, workspace, 1
	bind = $mainMod, 2, workspace, 2
	bind = $mainMod, 3, workspace, 3
	bind = $mainMod, 4, workspace, 4
	bind = $mainMod, 5, workspace, 5
	bind = $mainMod, 6, workspace, 6
	bind = $mainMod, 7, workspace, 7
	bind = $mainMod, 8, workspace, 8
	bind = $mainMod, 9, workspace, 9
	bind = $mainMod, 0, workspace, 10

	# Move active window to a workspace with mainMod + SHIFT + [0-9]
	bind = $mainMod SHIFT, 1, movetoworkspace, 1
	bind = $mainMod SHIFT, 2, movetoworkspace, 2
	bind = $mainMod SHIFT, 3, movetoworkspace, 3
	bind = $mainMod SHIFT, 4, movetoworkspace, 4
	bind = $mainMod SHIFT, 5, movetoworkspace, 5
	bind = $mainMod SHIFT, 6, movetoworkspace, 6
	bind = $mainMod SHIFT, 7, movetoworkspace, 7
	bind = $mainMod SHIFT, 8, movetoworkspace, 8
	bind = $mainMod SHIFT, 9, movetoworkspace, 9
	bind = $mainMod SHIFT, 0, movetoworkspace, 10

	# Example special workspace (scratchpad)
	bind = $mainMod, S, togglespecialworkspace, magic
	bind = $mainMod SHIFT, S, movetoworkspace, special:magic

	# Scroll through existing workspaces with mainMod + scroll
	bind = $mainMod, mouse_down, workspace, e+1
	bind = $mainMod, mouse_up, workspace, e-1

	# Move/resize windows with mainMod + LMB/RMB and dragging
	bindm = $mainMod, mouse:272, movewindow
	bindm = $mainMod, mouse:273, resizewindow

	# Laptop multimedia keys for volume and LCD brightness
	bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
	bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
	bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
	bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
	bindel = ,XF86MonBrightnessUp, exec, ~/.config/hypr/scripts/brillo_universal.sh +10
	bindel = ,XF86MonBrightnessDown, exec, ~/.config/hypr/scripts/brillo_universal.sh -10
	
	# Requires playerctl
	bindl = , XF86AudioNext, exec, playerctl next
	bindl = , XF86AudioPause, exec, playerctl play-pause
	bindl = , XF86AudioPlay, exec, playerctl play-pause
	bindl = , XF86AudioPrev, exec, playerctl previous
	
	# Tapa del portátil
	bindl = , switch:on:Lid Switch, exec, ~/.config/hypr/scripts/handle_lid.sh
	bindl = , switch:off:Lid Switch, exec, ~/.config/hypr/scripts/handle_lid.sh
	
	##############################
	### WINDOWS AND WORKSPACES ###
	##############################

	# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
	# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

	# Example windowrule v1
	# windowrule = float, ^(kitty)$

	# Example windowrule v2
	# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$

	# Ignore maximize requests from apps. You'll probably like this.
	# Corrección Línea 400: Bloquear eventos de maximizado universales

	# Fix some dragging issues with XWayland
	#windowrulev2 = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0
	#windowrulev2 = float, class:^(thunderbird)$

# ==========================================

# ========================================================
# REGLAS DE VENTANA (SINTAXIS ESTRICTA HYPRLAND v0.56.2)
# ========================================================
windowrule = suppress_event = maximize, match:class = .*
windowrule = float = true, match:title = ^(Discord)$
# Forzar que cualquier ventana de splash de la suite Opera flote y no rompa el mosaico
windowrule = match:class ^(opera)$, match:title ^(.*Splash.*)$, float 1
windowrule = match:class ^(opera)$, match:title ^(.*Splash.*)$, no_blur 1
windowrule = match:class ^(opera)$, match:title ^(.*Splash.*)$, center 1

